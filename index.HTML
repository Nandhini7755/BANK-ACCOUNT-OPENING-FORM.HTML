<!DOCTYPE html>
<html>
<head>
    <title>Bank Account Opening Form</title>
</head>
<body>

<h2>Bank Account Opening Form</h2>

<form>

    <label>Full Name:</label><br>
    <input type="text" name="fullname"><br><br>

    <label>Father's Name:</label><br>
    <input type="text" name="fathername"><br><br>

    <label>Date of Birth:</label><br>
    <input type="date" name="dob"><br><br>

    <label>Gender:</label><br>
    <input type="radio" name="gender"> Male
    <input type="radio" name="gender"> Female<br><br>

    <label>Mobile Number:</label><br>
    <input type="tel" name="mobile"><br><br>

    <label>Email:</label><br>
    <input type="email" name="email"><br><br>

    <label>Address:</label><br>
    <textarea name="address" rows="4" cols="30"></textarea><br><br>

    <label>Account Type:</label><br>
    <select name="account">
        <option>Savings</option>
        <option>Current</option>
        <option>Fixed Deposit</option>
    </select><br><br>

    <label>Aadhaar Number:</label><br>
    <input type="text" name="aadhaar"><br><br>

    <input type="submit" value="Submit">
    <input type="reset" value="Reset">

</form>

</body>
</html>
